name: build

# Builds spdhost for both phone architectures -- arm32 (Termux armv7l/armv8l)
# and arm64 (aarch64) -- zips each one with the menu, the loaders and the misc
# BCB images, and publishes both plus a combined zip to a GitHub Release whose
# body is the commit that produced it and the build date.
#
# Runs on a push to either of the two live branches when something under
# no-root/ (or android/, or the CI itself) changed, on a pull request into
# either of them, and on demand from the Actions tab. A pull request runs the
# same test, build and APK jobs but publishes nothing: every release and
# Telegram step is guarded by the event name.
on:
  push:
    branches:
      - main
      - experiment/brom-hello-diagnostics
    paths:
      - 'no-root/**'
      - 'android/**'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  pull_request:
    branches:
      - main
      - experiment/brom-hello-diagnostics
    paths:
      - 'no-root/**'
      - 'android/**'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One build per branch, queued rather than cancelled. Each push publishes its
  # own tag, so cancelling a run halfway would strand a release with only some
  # of its assets -- and the next push would not revisit that tag to repair it.
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Two sets in one list. The suite in no-root/tests compiles spdhost for the
  # runner, so it needs gcc and the real libusb headers (pkg-config finds them;
  # without the -dev package `-lusb-1.0` has no .so to link against) and
  # python3 for the pty driver. The cross build needs autoconf, automake and
  # libtool to build libusb from source, and qemu-user to smoke-test what it
  # produced. file and unzip are only for the "show what was produced" step.
  APT_DEPS: >-
    gcc make git pkg-config libusb-1.0-0-dev python3 python3-pip
    autoconf automake libtool qemu-user qemu-user-static
    file unzip

jobs:
  test:
    name: no-root test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_DEPS

      - name: Build spdhost
        working-directory: no-root
        run: make

      - name: spdhost --self-test
        working-directory: no-root
        run: ./spdhost --self-test

      - name: Run every suite in no-root/tests
        working-directory: no-root
        run: |
          # Each suite prints "PASS:"/"FAIL:" or "ok"/"FAIL" lines and a
          # trailing "<name>: N passed, M failed[, K skipped]" summary. Skips
          # are expected here for the two golden suites: they compare against
          # the vendor x86-64 binaries in the release tree, which is a local
          # artifact and is not in this repository. A skip is reported, never
          # counted as a pass. Anything with a non-zero failure count fails
          # the job and its output is echoed.
          #
          # set +e because the runner's shell is "bash -e {0}": without this,
          # a suite that exits non-zero aborts the step at the assignment
          # below, before its output is printed, and the failure is reported
          # as a bare exit code with nothing to diagnose. The loop judges each
          # suite itself and exits 1 at the end.
          set +e
          fail=0
          for t in tests/*.sh; do
            name=$(basename "$t" .sh)
            out=$("$t" 2>&1); rc=$?
            summary=$(printf '%s\n' "$out" | grep -E "^${name}: [0-9]+ passed," | tail -1)
            if [ -z "$summary" ]; then
              summary=$(printf '%s\n' "$out" | sed -n 's/^\(.*\): \([0-9]*\) passed, \([0-9]*\) failed.*/\1: \2 passed, \3 failed/p' | tail -1)
            fi
            # Some suites (exec-addr-seq) print only PASS/FAIL lines and no
            # summary, so fall back to counting them.
            [ -n "$summary" ] ||
              summary="passed=$(printf '%s\n' "$out" | grep -cE '^(PASS:|ok[[:space:]])' || true)"
            printf '%-16s rc=%s  %s\n' "$name" "$rc" "$summary"
            if [ "$rc" != 0 ] || printf '%s\n' "$out" | grep -qE '^(FAIL:|FAIL[[:space:]])'; then
              fail=1
              echo "--- $name output"
              printf '%s\n' "$out" | tail -60
            fi
          done
          [ "$fail" = 0 ] || { echo "test suite failed"; exit 1; }

  build:
    name: arm32 + arm64 static build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      # The pre-release tag the publish step made (empty on a pull request),
      # so the APK job attaches to the same release.
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_DEPS
          # ziglang ships zig, used only as a C compiler with its bundled musl.
          # It builds libusb and spdhost for the two phone targets, so no
          # Android SDK or NDK is involved.
          #
          # The retry is for PEP 668: the runner's system python refuses a
          # plain install on newer Ubuntu images. --break-system-packages does
          # not exist on older pip, hence the fallback rather than using it
          # outright. Either way the package lands under $HOME, not in the
          # system python.
          if ! pip3 install --user ziglang; then
            echo "plain install refused; retrying with --break-system-packages (PEP 668)"
            pip3 install --user --break-system-packages ziglang
          fi
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: make cross (arm32 + arm64)
        working-directory: no-root
        run: make cross

      - name: Show what was produced
        working-directory: no-root
        run: |
          ls -l dist dist/arm32 dist/arm64
          echo "--- dist/SHA256SUMS"
          cat dist/SHA256SUMS
          echo "--- per-architecture zips"
          unzip -l dist/arm32/spdhost-arm32-static-*.zip
          unzip -l dist/arm64/spdhost-arm64-static-*.zip

      - name: Keep the build for debugging
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: |
            no-root/dist/*.zip
            no-root/dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish the release
        id: publish
        # Never from a pull request: a PR build is checked, not released.
        if: github.event_name != 'pull_request'
        working-directory: no-root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          sha=$(git rev-parse HEAD)
          short=$(printf '%s' "$sha" | cut -c1-7)
          subject=$(git log -1 --pretty=%s)
          built=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          # A push checks out its branch, so this is the branch name; the
          # fallback is for a detached HEAD, where git prints "HEAD".
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$branch" = HEAD ]; then
            branch=${GITHUB_REF_NAME:-detached}
          fi

          # Tag shape follows the existing per-commit pre-releases:
          # spdhost-exp-<slug>-<short sha>. The slug is the first meaningful
          # word of the commit subject, with any "type(scope): " prefix
          # stripped and leading stopwords skipped -- taking the literal first
          # word gave "spdhost-exp-the-..." for "fix(tests,ci): the PAC suite
          # failed ...", which says nothing about the build.
          slug=$(printf '%s' "$subject" \
            | sed -E 's/^[a-z]+(\([^)]*\))?!?:[[:space:]]*//' \
            | tr 'A-Z' 'a-z' \
            | tr -cs 'a-z0-9' '\n' \
            | awk 'BEGIN{split("the a an and or of for to in on with at by from as is are be this that it its no not",s," "); for(i in s) stop[s[i]]=1}
                   $0 != "" && !stop[$0] { print substr($0,1,16); exit }')
          [ -n "$slug" ] || slug=build
          tag="spdhost-exp-$slug-$short"

          # The parenthetical in the release name is the commit subject, cut at
          # a word boundary so it never ends mid-word.
          summary=$(printf '%s' "$subject" | cut -c1-60)
          if [ "${#subject}" -gt 60 ]; then
            trimmed=$(printf '%s' "$summary" | sed -E 's/[[:space:]]+[^[:space:]]*$//')
            [ -n "$trimmed" ] && summary=$trimmed
          fi
          title="spdhost exp $slug $short ($summary)"

          assets=(
            "dist/arm32/spdhost-arm32-static-$short.zip"
            "dist/arm64/spdhost-arm64-static-$short.zip"
            "dist/spdhost-arm32-arm64-static-$short.zip"
            "dist/SHA256SUMS"
          )
          for a in "${assets[@]}"; do
            [ -f "$a" ] || { echo "missing asset: $a" >&2; exit 1; }
          done

          {
            echo "Experimental pre-release (not Latest) from \`$branch\` @ \`$sha\`."
            echo
            echo "Static musl builds of spdhost and the vendored spd_dump, with the"
            echo "menu, the FDL loaders, the per-model cboot images and the misc BCBs, for"
            echo "both phone architectures. arm32 is ARMv7-A + NEON (\`arm-linux-musleabihf\`),"
            echo "arm64 is generic \`aarch64\`. Each zip unpacks to its own \`spdhost-arm32/\`"
            echo "or \`spdhost-arm64/\` tree."
            echo
            echo "### Build"
            echo
            echo '```'
            echo "branch   $branch"
            echo "commit   $sha"
            echo "subject  $subject"
            echo "built    $built"
            echo "runner   $RUNNER_OS $RUNNER_ARCH"
            echo '```'
            echo
            echo "### Commit message"
            echo
            echo '```'
            # The full commit message, minus the Co-Authored-By trailer and any
            # blank lines left dangling at the end. Paragraph breaks survive.
            # The 200-line cap is inside awk, not a `head` after it: head
            # closing the pipe early would SIGPIPE awk, and pipefail would then
            # fail the step on a long commit message.
            git log -1 --pretty=%B | awk '
              /^Co-Authored-By:/ { next }
              { line[NR] = $0; if ($0 != "") last = NR; if (NR > 200) exit }
              END { for (i = 1; i <= last; i++) print line[i] }'
            echo '```'
            echo
            echo "### Files changed"
            echo
            echo '```'
            git show --stat --oneline --no-color -1 | tail -n +2
            echo '```'
            echo
            echo "### Assets"
            echo
            echo "- \`spdhost-arm32-static-$short.zip\` -- 32-bit ARM (Termux armv7l/armv8l)"
            echo "- \`spdhost-arm64-static-$short.zip\` -- 64-bit ARM (aarch64)"
            echo "- \`spdhost-arm32-arm64-static-$short.zip\` -- both trees in one zip"
            echo "- \`SHA256SUMS\` -- checksums for all of the above"
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "### Termux: install and run"
            echo
            echo "One line, in a Termux shell. It updates the packages, installs what"
            echo "the tool needs, downloads this release, unpacks the tree for this"
            echo "phone's architecture and starts the menu. Paste it whole and press"
            echo "enter:"
            echo
            echo '```sh'
            # Single-quoted on purpose: the line has $, "", () and || in it, and
            # a double-quoted echo would eat or mangle every one of them. Only
            # the three build facts are spliced in from this shell.
            echo 'pkg update -y && pkg upgrade -y && pkg install -y termux-api unzip curl && (termux-setup-storage || true) && curl -LO https://github.com/'"$GITHUB_REPOSITORY"'/releases/download/'"$tag"'/spdhost-arm32-arm64-static-'"$short"'.zip && unzip -o spdhost-arm32-arm64-static-'"$short"'.zip -d "$HOME" && cd "$HOME/$( [ "$(uname -m)" = aarch64 ] && echo spdhost-arm64 || echo spdhost-arm32 )" && bash scripts/menu.sh'
            echo '```'
            echo
            echo "\`termux-setup-storage\` opens the Android storage permission; allow"
            echo "it. That is what lets the tool use **shared storage**, where the"
            echo "images you actually have live. It reads and writes:"
            echo
            echo "- \`/sdcard/Download\` -- the images menu [6] flashes, and where"
            echo "  menu [1] dumps. Put \`boot.img\`, \`vbmeta.img\`, \`l_fixnv1.img\`"
            echo "  there from any file manager or browser download and flash them"
            echo "  straight away; a partition you just dumped is already there."
            echo "- \`partition_<unixtime>.xml\` -- every time the tool reads the"
            echo "  phone's partition table it leaves the same table here as the XML"
            echo "  menu [8] repartitions from, so there is always a copy to edit."
            echo
            echo "The folder is created on first run, and it is one folder for both"
            echo "directions. If the permission was denied, the tool says so and uses"
            echo "\`input/\` and \`backup/\` inside the folder you unzipped instead --"
            echo "nothing is lost, the files are just not on /sdcard. Extra menu [15]"
            echo "switches between the two, and \`SPDHOST_SHARED_DIR\` names a different"
            echo "shared folder."
            echo
            echo "The menu also asks once, on the first run, which loaders the phone"
            echo "uses. Pick **universal** if you do not know the model: it is the"
            echo "generic ums9230 pair shipped in \`fdl/ums9230/universal/\`."
            echo
            echo "Before the first run, install the **Termux:API** app from F-Droid"
            echo "(<https://f-droid.org/packages/com.termux.api/>) or the Play Store."
            echo "\`pkg install termux-api\` installs the command line tools only;"
            echo "\`termux-usb\` talks to that app, and without it the menu cannot see"
            echo "the phone. Open it once after installing so Android finishes setting"
            echo "it up. If the phone is not detected, run \`termux-wake-lock\` and turn"
            echo "off battery optimisation for both Termux and Termux:API."
            echo
            echo "The first time the menu reaches for the phone, Android shows a USB"
            echo "permission dialog for the Unisoc device: allow it. The wrapper also"
            echo "asks for it up front so the answer is cached for later sessions."
            echo
            echo "Then, for every session:"
            echo
            echo "1. Power the phone off and hold **volume down**."
            echo "2. Unplug it for at least 5 seconds first if it was connected."
            echo "3. Start the menu and pick the action; connect the cable only when it"
            echo "   says to, and keep holding volume down until it is running."
            echo
            echo "To re-run later without downloading again:"
            echo
            echo '```sh'
            echo 'cd "$HOME/spdhost-arm64"   # or spdhost-arm32'
            echo 'bash scripts/menu.sh'
            echo '```'
            echo
            echo "If a zip is ever re-downloaded over an old one, \`unzip -o\` replaces"
            echo "only files that are inside the zip. That includes the placeholder"
            echo "notes \`input/PUT-IMAGES-HERE.txt\` and \`backup/PUT-DUMPS-HERE.txt\`."
            echo "It does not replace partition images you added. The default layout"
            echo "keeps dumps and flash images in \`/sdcard/Download\`, which the zip"
            echo "does not contain."
          } >/tmp/body.md

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists; replacing its assets"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "$title" \
              --notes-file /tmp/body.md \
              --target "$sha" \
              --prerelease
          fi
          echo "published $tag"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  # The APK (spdhost-apk-phased-plan.md §3, §7). The app is a thin Android
  # front-end that execs the same static zig/musl spdhost the zips ship, from
  # nativeLibraryDir as libspdhost.so, and hands it the USB fd over a path
  # socket (option S). So the "native core for the APK ABIs" IS the `make
  # cross` output of the build job, copied, not rebuilt: arm32 ->
  # armeabi-v7a, arm64 -> arm64-v8a. The plan says no NDK (S needs no JNI), so
  # none is installed. minSdk 24 needs nothing different from the binary.
  #
  # Until the plan's P1-1 slice adds android/ (Gradle KTS app), this job
  # stages and checks the native core and uploads it; the Gradle steps are
  # skipped with a notice and turn on by themselves once android/ exists.
  #
  # It needs build, and nothing needs it except the notify job, so it can
  # neither block nor fail test/build or their release; its own failure shows
  # as a red APK job.
  apk:
    name: APK (native core + debug APK)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAVA_VERSION: '17'
      JAVA_DISTRIBUTION: temurin
      # cmdline-tools 19.0 (android-actions/setup-android's default build id)
      ANDROID_CMDLINE_TOOLS: '15859902'
      # targetSdk 35 per the plan; minSdk 24 lives in the app's Gradle file.
      ANDROID_PACKAGES: 'platform-tools platforms;android-35 build-tools;35.0.0'
    steps:
      - uses: actions/checkout@v4

      - name: Telegram helper self-test (no network, no secrets)
        run: bash .github/scripts/test-tg-notify.sh

      - name: Get the build job's zips
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Stage the native core for the APK ABIs
        id: core
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static file unzip >/dev/null
          sha=$(git rev-parse HEAD)
          rm -rf unz jniLibs && mkdir -p unz
          unzip -q dist/arm32/spdhost-arm32-static-*.zip -d unz
          unzip -q dist/arm64/spdhost-arm64-static-*.zip -d unz
          # ABI dir, zip tree, qemu, and what `file` must say.
          while read -r abi tree qemu want; do
            mkdir -p "jniLibs/$abi"
            cp "unz/$tree/spdhost" "jniLibs/$abi/libspdhost.so"
            desc=$(file -b "jniLibs/$abi/libspdhost.so")
            echo "$abi: $desc"
            case $desc in *"$want"*statically\ linked*) ;; *)
              echo "::error::$abi: libspdhost.so is not a static $want executable"; exit 1 ;; esac
            # The core must say which commit built it, and it must be this one:
            # the APK and the zips come from one SHA (plan A3).
            caps=$($qemu "jniLibs/$abi/libspdhost.so" caps </dev/null)
            got=$(printf '%s\n' "$caps" | sed -n 's/^build_sha=//p')
            printf '%s\n' "$caps" | grep -qx end || { echo "::error::$abi: caps output has no end line"; exit 1; }
            [ "$got" = "$sha" ] || { echo "::error::$abi: caps build_sha=$got, expected $sha"; exit 1; }
            echo "$abi: caps build_sha=$got"
          done <<'ABIS'
          armeabi-v7a spdhost-arm32 qemu-arm-static ARM,
          arm64-v8a spdhost-arm64 qemu-aarch64-static aarch64
          ABIS
          (cd jniLibs && sha256sum */libspdhost.so | tee SHA256SUMS)
          echo "short=$(printf '%s' "$sha" | cut -c1-7)" >>"$GITHUB_OUTPUT"

      - name: Keep the APK native core
        uses: actions/upload-artifact@v4
        with:
          name: apk-native-core-${{ github.sha }}
          path: jniLibs
          if-no-files-found: error

      - name: Is there an Android app project yet?
        id: app
        run: |
          if [ -x android/gradlew ] && { [ -f android/settings.gradle.kts ] || [ -f android/settings.gradle ]; }; then
            echo "present=true" >>"$GITHUB_OUTPUT"
            echo "android/ app project found; building the debug APK"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=APK::No android/ Gradle project on this commit yet (it lands with plan slice P1-1). The native core for armeabi-v7a and arm64-v8a was built, checked and uploaded; the JDK/SDK setup, Gradle unit tests, assembleDebug, the APK artifact, the release upload and the Telegram post are skipped and turn on by themselves once android/gradlew and android/settings.gradle(.kts) exist."
          fi

      - name: Set up JDK
        if: steps.app.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Set up the Android SDK
        if: steps.app.outputs.present == 'true'
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS }}
          packages: ${{ env.ANDROID_PACKAGES }}
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle (wrapper-pinned, cached)
        if: steps.app.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + debug APK
        id: gradle
        if: steps.app.outputs.present == 'true'
        working-directory: android
        run: |
          set -euo pipefail
          # jniLibs are filled by CI, never committed (plan §2).
          rm -rf app/src/main/jniLibs
          mkdir -p app/src/main
          cp -r ../jniLibs app/src/main/jniLibs
          rm -f app/src/main/jniLibs/SHA256SUMS
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo "::error::assembleDebug produced no APK"; exit 1; }
          out="$GITHUB_WORKSPACE/spdhost-${{ steps.core.outputs.short }}-debug.apk"
          cp "$apk" "$out"
          (cd "$GITHUB_WORKSPACE" && sha256sum "$(basename "$out")" > "$(basename "$out").sha256")
          echo "apk=$out" >>"$GITHUB_OUTPUT"

      - name: Keep the debug APK
        if: steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spdhost-apk-debug-${{ steps.core.outputs.short }}
          path: |
            spdhost-*-debug.apk
            spdhost-*-debug.apk.sha256
          if-no-files-found: error

      - name: Attach the APK to the pre-release
        # Only where the build job published (never on a pull request); the
        # release is the build job's --prerelease one, so never Latest.
        if: steps.app.outputs.present == 'true' && github.event_name != 'pull_request' && needs.build.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" spdhost-*-debug.apk spdhost-*-debug.apk.sha256 --clobber
          echo "attached to $TAG"

      - name: Post the APK to Telegram
        # Release path only. A Telegram problem must not fail the release, so
        # the step may fail on its own (non-ok reply) without failing the job.
        if: github.event_name != 'pull_request' && needs.build.outputs.tag != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ needs.build.outputs.tag }}
          APK: ${{ steps.gradle.outputs.apk }}
        run: |
          # No set -x here: the token must never reach the log.
          set -euo pipefail
          bash .github/scripts/tg-notify.sh release \
            --tag "$TAG" --sha "$(git rev-parse HEAD)" \
            --subject "$(git log -1 --format=%s HEAD)" \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --file "${APK:-}" --prerelease

  # PASS/FAIL to Telegram after every push build and release build. Never on a
  # pull request (fork PRs get no secrets anyway; the event and head-repo
  # guards make that explicit). It needs every other job but nothing needs
  # it, so it cannot change their gating; it runs with always(), so a red run
  # stays red (its own success cannot turn a failed job green) and a failed
  # send only adds a red notify job. Cancelled counts as FAIL and is named.
  notify:
    name: Telegram build result
    needs: [test, build, apk]
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.event.pull_request == null &&
      github.repository == 'Seuj09/Spd_dump_termux'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          fetch-depth: 1

      - name: Send PASS/FAIL
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R_TEST: ${{ needs.test.result }}
          R_BUILD: ${{ needs.build.result }}
          R_APK: ${{ needs.apk.result }}
        run: |
          # No set -x here: the token must never reach the log.
          set -euo pipefail
          failed=''
          add() { failed="${failed:+$failed, }$1 ($2)"; }
          # success and skipped are not failures (a job skipped because an
          # earlier one failed is covered by that one); failure and
          # cancelled are.
          for pair in "no-root test suite:$R_TEST" "arm32 + arm64 static build:$R_BUILD" "APK:$R_APK"; do
            r=${pair##*:}
            case $r in success|skipped) ;; *) add "${pair%:*}" "$r" ;; esac
          done
          result=pass; [ -z "$failed" ] || result=fail
          # The checkout is this run's commit; its subject line only.
          subj=$(git log -1 --format=%s HEAD)
          bash .github/scripts/tg-notify.sh status --result "$result" \
            --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --subject "$subj" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --failed "$failed"
